name: apk

# Compila los APK de Android TV (Check-in y Vitrina) y los sube al bucket privado de R2 «apk» como AF-checkin.apk y
# AF-vitrina.apk, junto a un AF-<app>.json con la versión y la huella (canal para la futura autoactualización).
# Se lanza a mano: Actions → apk → Run workflow (botón verde; «Re-run» repite el workflow viejo, no sirve).
# El repositorio es público y el APK lleva la clave del check-in dentro: el APK nunca se sube como artefacto de
# GitHub; solo va al bucket, cuyo acceso público se abre únicamente mientras se instala (Cloudflare).
#
# Secrets del repositorio (no de un Environment):
#   CHECKIN_CLAVE                                   la misma clave que tiene web-admin.
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   credenciales de R2 con permiso de escritura en el bucket.
#   APK_KEYSTORE_BASE64 (recomendado)               llave de firma fija en base64 (ver docs/ops/apk.md): sin ella
#                                                   cada APK se firma con una llave nueva y no se puede instalar encima.
# CHECKIN_API_URL puede ser variable o secret del repositorio. R2_APK_BUCKET_NAME (variable, opcional) vale «apk».
#
# Autoactualización (packages/ota): además del APK, publica la interfaz (zip) y ota/<app>/latest.json en el bucket de
# medios (R2_BUCKET_NAME, por defecto «adhara-fit-app», público en R2_PUBLIC_URL). Los APK ya instalados la descargan
# solos. R2_PUBLIC_URL (variable o secret) es la URL pública de ese bucket; sin ella el APK no se actualiza por OTA.
# El zip no lleva la clave: la configuración (URL y clave) solo va dentro del APK.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # La vitrina usa otros nombres de variable pero la misma clave y la misma URL que el check-in.
  CHECKIN_API_URL: ${{ vars.CHECKIN_API_URL || secrets.CHECKIN_API_URL }}
  CHECKIN_CLAVE: ${{ secrets.CHECKIN_CLAVE }}
  VITRINA_API_URL: ${{ vars.CHECKIN_API_URL || secrets.CHECKIN_API_URL }}
  VITRINA_CLAVE: ${{ secrets.CHECKIN_CLAVE }}
  # Cada corrida sube el código de versión: Android solo deja instalar encima un APK con versionCode mayor.
  APK_VERSION_CODE: ${{ github.run_number }}
  APK_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  apk:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-latest
    env:
      # Dirección de latest.json de esta app (vacía = el APK no se autoactualiza).
      ACTUALIZACIONES_URL: ${{ (vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL) && format('{0}/ota/{1}', vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL, matrix.app) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: checkin
            web: checkin
            tv: apps/checkin-tv/capacitor
          - app: vitrina
            web: vitrina
            tv: apps/vitrina-tv/capacitor
    steps:
      - name: Comprobar variables
        run: |
          test -n "$CHECKIN_API_URL" || { echo "Falta CHECKIN_API_URL (como variable o como secret del repositorio)."; exit 1; }
          test -n "$CHECKIN_CLAVE" || { echo "Falta el secret CHECKIN_CLAVE."; exit 1; }
          test -n "$R2_ACCOUNT_ID" || { echo "Falta el secret R2_ACCOUNT_ID."; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo "Falta el secret R2_ACCESS_KEY_ID."; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "Falta el secret R2_SECRET_ACCESS_KEY."; exit 1; }
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Capacitor 8 compila con Java 21 (sourceCompatibility en capacitor.build.gradle).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci --ignore-scripts

      # Export estático de la interfaz (apps/<app>/out); el APK la lleva empaquetada.
      - run: npm run build --workspace ${{ matrix.web }}

      - name: Instalar Capacitor
        working-directory: ${{ matrix.tv }}
        run: npm ci

      - name: Empaquetar la interfaz y la configuración
        working-directory: ${{ matrix.tv }}
        run: npm run sync

      # build.gradle firma con android/app/debug.keystore (alias androiddebugkey, clave «android»), que no se versiona.
      # Con APK_KEYSTORE_BASE64 se usa siempre la misma llave y el APK se puede instalar encima del anterior; sin ese
      # secret se genera una llave nueva en cada corrida y hay que desinstalar el APK anterior del TV.
      - name: Preparar la llave de firma
        working-directory: ${{ matrix.tv }}/android/app
        run: |
          if [ -n "$APK_KEYSTORE_BASE64" ]; then
            echo "$APK_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Llave de firma fija (APK_KEYSTORE_BASE64)."
          else
            echo "::warning::Sin APK_KEYSTORE_BASE64: llave nueva en cada corrida; para actualizar un TV habrá que desinstalar el APK anterior."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}

      - name: Compilar el APK
        working-directory: ${{ matrix.tv }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir al bucket apk (R2)
        run: |
          set -e
          APK="${{ matrix.tv }}/android/app/build/outputs/apk/debug/app-debug.apk"
          NOMBRE="AF-${{ matrix.app }}"
          mkdir -p salida
          cp "$APK" "salida/$NOMBRE.apk"
          SHA=$(sha256sum "salida/$NOMBRE.apk" | cut -d' ' -f1)
          printf '{"app":"%s","versionCode":%s,"versionName":"%s","sha256":"%s","apk":"%s.apk"}\n' \
            "${{ matrix.app }}" "$APK_VERSION_CODE" "$APK_VERSION_NAME" "$SHA" "$NOMBRE" > "salida/$NOMBRE.json"
          DESTINO="s3://${R2_APK_BUCKET_NAME:-apk}"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "salida/$NOMBRE.apk" "$DESTINO/$NOMBRE.apk" --endpoint-url "$ENDPOINT" --content-type application/vnd.android.package-archive
          aws s3 cp "salida/$NOMBRE.json" "$DESTINO/$NOMBRE.json" --endpoint-url "$ENDPOINT" --content-type application/json --cache-control "no-store"
          echo "Subido $NOMBRE.apk (versión $APK_VERSION_NAME, sha256 $SHA)."
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_APK_BUCKET_NAME: ${{ vars.R2_APK_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 no acepta las sumas de verificación nuevas del cliente de AWS.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      # La interfaz exportada (sin configuración ni clave) se publica como zip versionado y latest.json apunta a ella.
      # Va al final: solo se publica si el APK compiló. latest.json se sube el último para que nunca apunte a un zip ausente.
      - name: Publicar la actualización de la interfaz (R2)
        if: env.ACTUALIZACIONES_URL != ''
        run: |
          set -e
          ZIP="${APK_VERSION_CODE}.zip"
          mkdir -p ota
          (cd "apps/${{ matrix.web }}/out" && zip -qr "$GITHUB_WORKSPACE/ota/$ZIP" .)
          if unzip -l "ota/$ZIP" | grep -Eq "(checkin|vitrina)-config\.json"; then echo "El zip lleva configuración: se aborta."; exit 1; fi
          SHA=$(sha256sum "ota/$ZIP" | cut -d' ' -f1)
          printf '{"app":"%s","versionCode":%s,"versionName":"%s","zip":"%s","sha256":"%s"}\n' \
            "${{ matrix.app }}" "$APK_VERSION_CODE" "$APK_VERSION_NAME" "$ZIP" "$SHA" > ota/latest.json
          DESTINO="s3://${R2_BUCKET_NAME:-adhara-fit-app}/ota/${{ matrix.app }}"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "ota/$ZIP" "$DESTINO/$ZIP" --endpoint-url "$ENDPOINT" --content-type application/zip
          aws s3 cp ota/latest.json "$DESTINO/latest.json" --endpoint-url "$ENDPOINT" --content-type application/json --cache-control "no-store"
          echo "Publicada la interfaz $APK_VERSION_NAME en $ACTUALIZACIONES_URL (sha256 $SHA)."
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      - name: Aviso si no se publicó la actualización
        if: env.ACTUALIZACIONES_URL == ''
        run: |
          echo "::warning::Sin R2_PUBLIC_URL este APK no se autoactualizará (hay que reinstalarlo a mano)."
