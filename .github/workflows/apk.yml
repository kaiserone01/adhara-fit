name: apk

# Compila los APK de Android TV (Check-in y Vitrina) y sube cada uno CIFRADO como artefacto.
# Se lanza a mano: Actions → apk → Run workflow.
# El repositorio es público y el APK lleva la clave del check-in dentro, así que nunca se sube sin cifrar.
# Secrets del repositorio: CHECKIN_CLAVE y APK_PASSPHRASE. Variable del repositorio: CHECKIN_API_URL.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # La vitrina usa otros nombres de variable pero la misma clave y la misma URL que el check-in.
  CHECKIN_API_URL: ${{ vars.CHECKIN_API_URL }}
  CHECKIN_CLAVE: ${{ secrets.CHECKIN_CLAVE }}
  VITRINA_API_URL: ${{ vars.CHECKIN_API_URL }}
  VITRINA_CLAVE: ${{ secrets.CHECKIN_CLAVE }}

jobs:
  apk:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: checkin
            web: checkin
            tv: apps/checkin-tv/capacitor
          - app: vitrina
            web: vitrina
            tv: apps/vitrina-tv/capacitor
    steps:
      - name: Comprobar variables
        run: |
          test -n "$CHECKIN_API_URL" || { echo "Falta la variable CHECKIN_API_URL del repositorio."; exit 1; }
          test -n "$CHECKIN_CLAVE" || { echo "Falta el secret CHECKIN_CLAVE."; exit 1; }
          test -n "$APK_PASSPHRASE" || { echo "Falta el secret APK_PASSPHRASE."; exit 1; }
        env:
          APK_PASSPHRASE: ${{ secrets.APK_PASSPHRASE }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Capacitor 8 compila con Java 21 (sourceCompatibility en capacitor.build.gradle).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci --ignore-scripts

      # Export estático de la interfaz (apps/<app>/out); el APK la lleva empaquetada.
      - run: npm run build --workspace ${{ matrix.web }}

      - name: Instalar Capacitor
        working-directory: ${{ matrix.tv }}
        run: npm ci

      - name: Empaquetar la interfaz y la configuración
        working-directory: ${{ matrix.tv }}
        run: npm run sync

      # build.gradle firma con android/app/debug.keystore, que no se versiona (*.keystore en .gitignore).
      # Cada ejecución genera una llave nueva: para actualizar un TV hay que desinstalar el APK anterior.
      - name: Generar la llave de debug
        working-directory: ${{ matrix.tv }}/android/app
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar el APK
        working-directory: ${{ matrix.tv }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Cifrar el APK
        run: |
          mkdir -p salida
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:APK_PASSPHRASE \
            -in "${{ matrix.tv }}/android/app/build/outputs/apk/debug/app-debug.apk" \
            -out "salida/adhara-${{ matrix.app }}.apk.enc"
        env:
          APK_PASSPHRASE: ${{ secrets.APK_PASSPHRASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: adhara-${{ matrix.app }}-apk-cifrado
          path: salida/adhara-${{ matrix.app }}.apk.enc
          retention-days: 14
          if-no-files-found: error
