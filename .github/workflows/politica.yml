name: politica

# Aplica las reglas del propietario (CLAUDE.md §1) a cada pull request.
# Las acciones usan etiqueta mayor (v4); fijarlas por SHA es una mejora pendiente (no verificado aquí).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: politica-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  politica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Política de commits sobre el rango del PR
        run: node tools/commit-policy.mjs --range "$BASE_SHA..$HEAD_SHA"

      - name: Autotest del arnés
        run: node tools/harness-selftest.mjs

      - name: Commits verificados por GitHub (aviso, no bloquea)
        run: |
          set -eu
          fallos=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            verificado=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.verified')
            motivo=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.reason')
            echo "$sha verified=$verificado ($motivo)"
            if [ "$verificado" != "true" ]; then fallos=$((fallos + 1)); fi
          done
          if [ "$fallos" -gt 0 ]; then
            echo "::warning::$fallos commit(s) sin firma verificada. Desde 2026-11-12 es un aviso (reglas 1 y 2 anuladas por el propietario); ver docs/ops/firma-commits.md"
          fi
