name: politica

# Aplica las reglas del propietario (CLAUDE.md §1) a cada pull request.
# Las acciones usan etiqueta mayor (v4); fijarlas por SHA es una mejora pendiente (no verificado aquí).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: politica-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  politica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Política de commits sobre el rango del PR
        run: node tools/commit-policy.mjs --range "$BASE_SHA..$HEAD_SHA"

      - name: Autotest del arnés
        run: node tools/harness-selftest.mjs

      - name: Commits verificados por GitHub
        run: |
          set -eu
          fallos=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            verificado=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.verified')
            motivo=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.reason')
            echo "$sha verified=$verificado ($motivo)"
            if [ "$verificado" != "true" ]; then fallos=$((fallos + 1)); fi
          done
          if [ "$fallos" -gt 0 ]; then
            echo "::error::$fallos commit(s) sin firma verificada. Ver docs/ops/firma-commits.md y docs/ops/github-setup.md"
            exit 1
          fi

      - name: Exige handoff.md en el PR
        run: |
          set -eu
          if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'handoff.md'; then
            echo "::error::handoff.md no fue modificado en el PR (protocolo de cierre, CLAUDE.md §6)"
            exit 1
          fi
          node tools/check-handoff.mjs

      - name: spec-lint (si existen specs)
        run: |
          set -eu
          if ls docs/superpowers/specs/S-*.md >/dev/null 2>&1; then
            test -f tools/spec-lint.mjs || { echo "::error::existen specs pero falta tools/spec-lint.mjs"; exit 1; }
            node tools/spec-lint.mjs
          else
            echo "No hay specs todavía: spec-lint omitido."
          fi
